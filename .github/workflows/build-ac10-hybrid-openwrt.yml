name: Build Tenda AC10 V1.0 Hybrid OpenWrt 4.14

on:
  workflow_dispatch:

jobs:
  build-firmware:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Hybrid Kit Repository
        uses: actions/checkout@v4

      - name: Free Disk Space & Install OpenWrt Build Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev libncurses5-dev \
            libncursesw5-dev libssl-dev python2 python3 python3-distutils-extra \
            rsync squashfs-tools subversion swig time unzip wget xz-utils xsltproc \
            zlib1g-dev device-tree-compiler

      - name: Build Hybrid OpenWrt 4.14 (HWNAT 940Mbps + rtl8192cd 867Mbps)
        run: |
          if [ -f "Tenda_AC10_V1_Hybrid_Kit/build_hybrid_openwrt_ac10.sh" ]; then
            chmod +x Tenda_AC10_V1_Hybrid_Kit/build_hybrid_openwrt_ac10.sh
            bash Tenda_AC10_V1_Hybrid_Kit/build_hybrid_openwrt_ac10.sh
          else
            chmod +x ./build_hybrid_openwrt_ac10.sh
            bash ./build_hybrid_openwrt_ac10.sh
          fi

      - name: Upload Compiled Tenda AC10 V1.0 Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tenda-ac10-v1-hybrid-openwrt-4.14
          path: |
            Tenda_AC10_V1_Hybrid_Kit/build_tree/openwrt-hybrid/bin/targets/**/*.bin
            build_tree/openwrt-hybrid/bin/targets/**/*.bin
